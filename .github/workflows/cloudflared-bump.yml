name: cloudflared bump

# Weekly: mirror Termux's newest cloudflared .debs to a release and, if newer than the pin,
# open a PR bumping capullo-tunnel to it. See scripts/cloudflared-bump.sh.
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch build.yml on the bump branch (GITHUB_TOKEN PRs don't trigger CI)

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror + bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/cloudflared-bump.sh
